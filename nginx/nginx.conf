server {
    listen 80;
    server_name _;

    # ── Vue SPA ──────────────────────────────────────────────────────────
    root /usr/share/nginx/html/app;
    index index.html;

    # Include standard MIME types
    include /etc/nginx/mime.types;

    # Serve the WASM file with the correct MIME type
    types {
        application/wasm wasm;
    }

    # SPA fallback — any path that doesn't match a file gets index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Django API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Django admin (optional, remove if not needed) ────────────────────
    location /admin/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Django static files (collected by collectstatic) ─────────────────
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Cache policy for frontend assets ─────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/wasm
        image/svg+xml;
    gzip_min_length 256;
}
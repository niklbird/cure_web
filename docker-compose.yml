services:
  # ─── Rust → WASM build stage (runs once, then exits) ──────────────────────
  #wasm-builder:
  #  build:
  #    context: wasm
  #    dockerfile: Dockerfile
  #  volumes:
  #    - wasm-output:/output

  # ─── Vue.js frontend (builds after WASM, served by nginx) ─────────────────
  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
    #depends_on:
    #  wasm-builder:
    #    condition: service_completed_successfully
    volumes:
      - wasm-output:/wasm-input:ro
      - frontend-dist:/output

  # ─── Nginx serves SPA ──────────────────────────────────────────────────
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    depends_on:
      frontend:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html/app:ro
    environment:
      - APP_BASE_PATH=/app/cure_web
      - NGINX_ENVSUBST_FILTER=APP_BASE_PATH

volumes:
  wasm-output:
  frontend-dist:

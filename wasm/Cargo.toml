[package]
name = "cure_web"
version = "0.1.0"
edition = "2021"



[dependencies]
cure_asn1 = {path="./cure_asn1"}
serde = { version = "1.0.*", default-features = false }
serde_json="1.0"
chrono = "0.4.23"
regex = "1"
base64 = "0.20.0"
hex = "0.4"
cure_pp = {path="./cure_pp", features = ["no_cached_keys"]}
flate2 = "1.1.1"
tar = "0.4.44"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
web = []

# Only pulled in for the browser build. `getrandom`'s `js` backend routes to
# crypto.getRandomValues, which does not exist off wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
getrandom = { version = "0.2", features = ["js"] }
